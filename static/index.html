<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTMX Todo App</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"></script>
    <script src="https://unpkg.com/htmx-ext-event-header@2.0.0/event-header.js"></script>
    <script src="/static/assets/date-picker.js"></script>
    <script src="/static/assets/index-CUzFA9AE.js" defer></script>

    <style>
      * {
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        margin: 0;
        background: #f5f6f8;
      }

      h1 {
        text-align: center;
        margin: 30px 0;
      }

      .container {
        display: flex;
        max-width: 1200px;
        margin: 0 auto;
        gap: 30px;
        padding: 20px;
      }

      /* Sidebar */
      .sidebar {
        width: 280px;
      }

      .task-card,
      .pink-card {
        background: #184fa3;
        color: white;
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        margin-bottom: 20px;
      }

      .pink-card {
        background: #a60548;
      }

      .task-card h2 {
        margin: 0;
        font-size: 22px;
      }

      .task-card span {
        font-size: 18px;
        opacity: 0.9;
      }

      .category {
        background: #e5e5e5;
        padding: 12px 16px;
        border-radius: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        cursor: pointer;
      }

      .category-badge {
        background: orange;
        color: white;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 14px;
      }

      /* Main content */
      .content {
        flex: 1;
      }

      .form-row {
        margin-bottom: 15px;
      }

      .form-row button {
        background: green;
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: 20px;
        cursor: pointer;
      }

      .select-row {
        margin-bottom: 20px;
      }

      .select-row select {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
      }

      .todo-item {
        background: #dbe3ef;
        padding: 18px;
        border-radius: 12px;
        margin-bottom: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .done {
        opacity: 0.6;
      }

      .done-btn {
        background: green;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 20px;
        cursor: pointer;
      }

      .warning,
      .success {
        background: red;
        color: white;
        padding: 8px;
        font-size: 0.8em;
        margin-bottom: 5px;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        box-sizing: border-box;
        transform: translateY(-100%);
        animation-name: message;
        animation-duration: 5s;
        text-align: center;
      }

      .success {
        background: green;
      }

      @keyframes message {
        0% {
          transform: translateY(-100%);
        }
        10% {
          transform: translateY(0%);
        }
        90% {
          transform: translateY(0%);
        }
        100% {
          transform: translateY(-100%);
        }
      }
    </style>
  </head>
  <body hx-ext="event-header">
    <div id="message"></div>
    <h1>{{.Title}}</h1>

    <div class="container">
      <div class="sidebar">
        <div
          class="{{if .SidebarTaskCardClass}}{{.SidebarTaskCardClass}}{{else}}task-card{{end}}"
        >
          <h2>Tasks</h2>
          <span
            hx-get="/get_stats"
            hx-include="#todoForm"
            hx-trigger="load, stats_changed from:body"
          ></span>
        </div>

        <div
          hx-get="/get_categories"
          hx-include="#todoForm"
          hx-trigger="load, stats_changed from:body"
        ></div>
      </div>

      <div class="content">
        <form
          id="todoForm"
          hx-post="/add_todo"
          hx-target="#todo-list"
          hx-swap="none"
        >
          <div class="form-row" id="date-picker-container">
            <date-picker timezone="America/Bogota"></date-picker>

            <date-picker
              placeholder="Select a date"
              months="January,February,March,April,May,June,July,August,September,October,November,December"
              days-short="Mo,Tu,We,Th,Fr,Sa,Su"
              days-long="Monday,Tuesday,Wednesday,Thursday,Friday,Saturday,Sunday"
              primary-color="#029E0F"
              secondary-color="#006B00"
              border
              border-radius="16px"
              timezone="America/New_York"
            ></date-picker>

            <date-picker
              placeholder="Selecione uma data"
              months="Janeiro,Fevereiro,Março,Abril,Maio,Junho,Julho,Agosto,Setembro,Outubro,Novembro,Dezembro"
              days-short="Se,Te,Qu,Qu,Se,Sá,Do"
              days-long="segunda,terça,quarta,quinta,sexta,sábado,domingo"
              primary-color="#FF5722"
              secondary-color="#FF5722"
              border
              border-radius="20"
              timezone="Europe/Lisbon"
            ></date-picker>

            <date-picker
              placeholder="Оберіть дату"
              months="Січень,Лютий,Березень,Квітень,Травень,Червень,Липень,Серпень,Вересень,Жовтень,Листопад,Грудень"
              days-short="Пн,Вт,Ср,Чт,Пт,Сб,Нд"
              days-long="понеділок,вівторок,середа,четвер,п'ятниця,субота,неділя"
              primary-color="#CCD74D"
              secondary-color="#2D7AFF"
              border
              border-radius="0"
              timezone="Europe/Kyiv"
            ></date-picker>
          </div>
          <div class="form-row">
            <mui-text
              width="80%"
              height="50px"
              name="todo"
              label="Add a new task"
              variant="standard"
            ></mui-text>
            <mui-text-lit
              width="80%"
              height="50px"
              label="Add a new task"
              variant="standard"
            ></mui-text-lit>
            <mui-text-lit
              width="80%"
              height="50px"
              label="Add a new task"
              variant="outlined"
            ></mui-text-lit>
            <mui-text-lit
              width="80%"
              height="50px"
              label="Add a new task"
              variant="filled"
            ></mui-text-lit>
            <button>Add todo</button>
          </div>

          <div class="select-row">
            <select name="category">
              <option value="">--- Select a category ---</option>
              {{if .CategoryOptions}} {{range .CategoryOptions}}
              <option value="{{.}}">{{.}}</option>
              {{end}} {{end}}
            </select>
          </div>

          <div class="extra-fields">
            {{if .ExtraFields}} {{range .ExtraFields}} {{.}} {{end}} {{end}}
          </div>
        </form>

        <div
          id="todo-list"
          hx-get="/get_todos"
          hx-include="#todoForm"
          hx-trigger="load, stats_changed from:body"
        ></div>
      </div>
    </div>
  </body>
</html>
